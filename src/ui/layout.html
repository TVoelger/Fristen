<div id="fristen-app" lang="de">
  
  <header class="ff-top">
    <span class="ff-brand"><span class="ff-brand-full">ARNOLD RUESS</span><span class="ff-brand-short">AR</span></span>
    <nav class="ff-nav" aria-label="Hauptnavigation" id="ff-nav"></nav>
    <details class="ff-menu ff-profile" id="ff-profile">
      <summary aria-label="Profil und Demoansicht"><span class="ff-avatar" id="ff-avatar">ClB</span><span class="ff-profile-name" id="ff-profile-name" hidden>ClB</span><i data-lucide="chevron-down" aria-hidden="true"></i></summary>
      <div class="ff-menu-body">
        <button type="button" data-settings>Einstellungen</button>
        <div class="ff-menu-label ff-menu-separator">Demoansicht</div>
        <div id="ff-profile-users"></div>
      </div>
    </details>
  </header>
  <main class="ff-main">
    <div id="ff-live" class="ff-notice" role="status" aria-live="polite"></div>
    <div id="ff-content"></div>
    <footer class="ff-footer"><span>Testversion · lokale Beispieldaten</span><span id="ff-clock"></span></footer>
  </main>
  <dialog id="ff-dialog" class="ff-dialog" aria-labelledby="ff-dialog-title">
    <header class="ff-dialog-header">
      <div id="ff-dialog-heading"></div>
      <button type="button" class="ff-dialog-close" data-dialog-close aria-label="Fenster schließen" title="Schließen (Esc)"><i data-lucide="x" aria-hidden="true"></i></button>
    </header>
    <div class="ff-dialog-body">
      <div id="ff-dialog-notice" class="ff-notice" role="status" aria-live="polite"></div>
      <div id="ff-dialog-content"></div>
    </div>
  </dialog>
</div>
